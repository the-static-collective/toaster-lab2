name: bridge-proof

on:
  push:
    branches:
      - main
      - agent/issue-1-authoring-boundary
      - agent/pr-3-exportable-proposal
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
